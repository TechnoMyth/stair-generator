site_name: Stair Generator
site_url: https://docs.technomyth.com/stair-generator/
repo_url: https://github.com/TechnoMyth/stair-generator
site_description: Procedural staircases and railings for game engines
copyright: Copyright TechnoMyth
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - toc.follow
    - search.highlight
  palette:
    - scheme: slate
      primary: amber
      accent: deep orange
markdown_extensions:
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Unity:
      - Manual: unity/index.md
      - Changelog: unity/changelog.md
